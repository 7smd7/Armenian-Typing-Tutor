name: Build and deploy to GitHub Pages

permissions:
    contents: write
    pages: write

on:
    push:
        branches: [main]

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  persist-credentials: true

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Deploy to GitHub Pages
              uses: peaceiris/actions-gh-pages@v3
              with:
                  # Use a personal access token if provided in repo secrets (GH_PAGES_PAT),
                  # otherwise fall back to the default GITHUB_TOKEN.
                  github_token: ${{ secrets.GH_PAGES_PAT || github.token }}
                  publish_dir: ./dist
                  publish_branch: gh-pages
