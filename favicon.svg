<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#4F46E5"/>
  
  <!-- Keyboard representation -->
  <!-- Top row -->
  <rect x="6" y="8" width="4" height="4" rx="0.5" fill="white" opacity="0.9"/>
  <rect x="11" y="8" width="4" height="4" rx="0.5" fill="white" opacity="0.9"/>
  <rect x="16" y="8" width="4" height="4" rx="0.5" fill="white" opacity="0.9"/>
  <rect x="21" y="8" width="4" height="4" rx="0.5" fill="white" opacity="0.9"/>
  
  <!-- Middle row -->
  <rect x="7" y="13" width="4" height="4" rx="0.5" fill="white" opacity="0.9"/>
  <rect x="12" y="13" width="4" height="4" rx="0.5" fill="white" opacity="0.95"/>
  <rect x="17" y="13" width="4" height="4" rx="0.5" fill="white" opacity="0.9"/>
  <rect x="22" y="13" width="4" height="4" rx="0.5" fill="white" opacity="0.9"/>
  
  <!-- Bottom row -->
  <rect x="8" y="18" width="4" height="4" rx="0.5" fill="white" opacity="0.9"/>
  <rect x="13" y="18" width="4" height="4" rx="0.5" fill="white" opacity="0.9"/>
  <rect x="18" y="18" width="4" height="4" rx="0.5" fill="white" opacity="0.9"/>
  
  <!-- Space bar -->
  <rect x="8" y="23" width="16" height="3" rx="0.5" fill="white" opacity="0.95"/>
  
  <!-- Armenian letter Ա -->
  <text x="14" y="16" font-family="Arial, sans-serif" font-size="4" font-weight="bold" fill="#4F46E5" text-anchor="middle">Ա</text>
</svg>
